<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>모바일 보드게임 타이머</title>

    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e272e">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e272e;
            color: #d2dae2;
            overflow: hidden;
        }

        #settings-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background-color: #2c3e50;
        }

        .settings-card {
            background-color: #34495e;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-height: 95vh;
            overflow-y: auto;
        }

        h2 { text-align: center; margin-bottom: 20px; }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label { margin-bottom: 5px; font-weight: bold; font-size: 0.95em; }

        select, input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 1.1em;
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .btn-start {
            margin-top: 15px;
            padding: 15px;
            width: 100%;
            background-color: #0be881;
            color: #1e272e;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start:active { background-color: #05c46b; }

        #timer-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* 기본 대기 상태 (회색) */
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5em;
            font-weight: bold;
            /* 부드러운 색상 전환을 위해 transition 유지 */
            transition: background 0.1s, color 0.1s; 
            background-color: #7f8c8d;
            color: rgba(255,255,255,0.5);
            position: relative;
        }

        #p1-area { transform: rotate(180deg); }

        /* 활성 상태 (진행 중 - 기본 흰색) !important 제거 */
        .player-area.active {
            background-color: #ffffff;
            color: #000000;
        }

        /* 승리, 패배 상태 (JS 인라인 스타일보다 낮지만 클래스로 적용) !important 제거 */
        .player-area.winner {
            background-color: #2980b9; 
            color: #ffffff;
        }

        .player-area.loser {
            background-color: #c0392b; 
            color: #ffffff;
        }

        .timer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .time-display { 
            font-variant-numeric: tabular-nums; 
            transition: font-size 0.1s; 
        }
        
        .sub-info {
            font-size: 0.25em;
            margin-top: 10px;
            font-weight: normal;
            height: 30px;
        }

        .rule-info {
            font-size: 0.18em;
            margin-top: 5px;
            opacity: 0.7;
            font-weight: 600;
        }

        .result-display {
            display: none;
            font-size: 1.5em; 
            font-weight: 900;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
        }

        .center-bar {
            height: 60px;
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .btn-pause {
            background-color: #ffa801;
            border: none;
            border-radius: 30px;
            padding: 10px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #1e272e;
            cursor: pointer;
        }

        #pause-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-modal {
            background-color: #0be881;
            border: none;
            padding: 15px 40px;
            margin: 10px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            width: 280px;
        }
        .btn-settings { background-color: #ff3f34; color: white; }
    </style>
</head>
<body>

    <div id="settings-screen">
        <div class="settings-card">
            <h2>타이머 설정</h2>
            
            <div class="form-group">
                <label>시간 규칙</label>
                <select id="ruleSelect" onchange="toggleByoyomiCount()">
                    <option value="byoyomi">초읽기 (기본시간 먼저 소모)</option>
                    <option value="fischer">피셔 (턴당 시간 추가)</option>
                    <option value="delay">딜레이 (유예시간 동안 소모 없음)</option>
                    <option value="tournament">체스 대회 (지정 턴 도달 시 시간 추가)</option>
                </select>
            </div>

            <div class="form-group">
                <label>기본 시간 (초)</label>
                <input type="number" id="mainTime" value="300" inputmode="numeric">
            </div>
            
            <div class="form-group" id="incrementTimeGroup" style="display: none;">
                <label>턴당 추가 시간 (초)</label>
                <input type="number" id="incrementTime" value="30" inputmode="numeric">
            </div>

            <div class="form-group">
                <label id="extraTimeLabel">초읽기 시간 (초)</label>
                <input type="number" id="extraTime" value="30" inputmode="numeric">
            </div>

            <div class="form-group" id="byoyomiCountGroup">
                <label id="countLabel">초읽기 횟수</label>
                <input type="number" id="byoyomiCount" value="3" inputmode="numeric">
            </div>

            <button class="btn-start" onclick="applyAndStart()">완료 및 시작</button>
        </div>
    </div>

    <div id="timer-screen">
        <div class="player-area" id="p1-area" onmousedown="tapArea(1)" ontouchstart="tapArea(1)">
            <div class="timer-content" id="p1-content">
                <div class="time-display" id="p1-time">00:00</div>
                <div class="sub-info" id="p1-sub">터치하여 시작</div>
                <div class="rule-info" id="p1-rule"></div>
            </div>
            <div class="result-display" id="p1-result"></div>
        </div>

        <div class="center-bar">
            <button class="btn-pause" onclick="pauseGame()">일시정지</button>
        </div>

        <div class="player-area" id="p2-area" onmousedown="tapArea(2)" ontouchstart="tapArea(2)">
            <div class="timer-content" id="p2-content">
                <div class="time-display" id="p2-time">00:00</div>
                <div class="sub-info" id="p2-sub">터치하여 시작</div>
                <div class="rule-info" id="p2-rule"></div>
            </div>
            <div class="result-display" id="p2-result"></div>
        </div>
    </div>

    <div id="pause-modal">
        <button class="btn-modal" onclick="resumeGame()">계속하기</button>
        <button class="btn-modal btn-settings" onclick="goToSettings()">설정으로 돌아가기</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(error => console.log('Service Worker 등록 실패:', error));
            });
        }

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        let rule = 'byoyomi';
        let config = { mainMs: 0, extraMs: 0, count: 0, incrementMs: 0 };
        let p1 = { mainMs: 0, extraMs: 0, count: 0, turns: 0 };
        let p2 = { mainMs: 0, extraMs: 0, count: 0, turns: 0 };
        
        let activePlayer = 0; 
        let timerInterval = null;
        let lastTickTime = 0;
        let isPaused = false;
        let lastRule = 'byoyomi';

        function toggleByoyomiCount() {
            const select = document.getElementById('ruleSelect').value;
            const countGroup = document.getElementById('byoyomiCountGroup');
            const incGroup = document.getElementById('incrementTimeGroup');
            const countLabel = document.getElementById('countLabel');
            const extraLabel = document.getElementById('extraTimeLabel');
            
            const mainInput = document.getElementById('mainTime');
            const extraInput = document.getElementById('extraTime');
            const countInput = document.getElementById('byoyomiCount');
            const incInput = document.getElementById('incrementTime');

            if (select === 'byoyomi') {
                countGroup.style.display = 'flex'; incGroup.style.display = 'none';
                countLabel.innerText = '초읽기 횟수'; extraLabel.innerText = '초읽기 시간 (초)';
                if (lastRule !== 'byoyomi') { mainInput.value = 300; extraInput.value = 30; countInput.value = 3; }
            } else if (select === 'tournament') {
                countGroup.style.display = 'flex'; incGroup.style.display = 'flex';
                countLabel.innerText = '시간이 추가될 목표 턴 수 (예: 40)'; extraLabel.innerText = '목표 턴 통과 시 통째로 추가할 시간 (초)';
                if (lastRule !== 'tournament') { mainInput.value = 5400; extraInput.value = 1800; countInput.value = 40; incInput.value = 30; }
            } else if (select === 'fischer') {
                countGroup.style.display = 'none'; incGroup.style.display = 'none';
                extraLabel.innerText = '턴당 추가 시간 (초)';
                if (lastRule !== 'fischer') { mainInput.value = 300; extraInput.value = 10; }
            } else if (select === 'delay') {
                countGroup.style.display = 'none'; incGroup.style.display = 'none';
                extraLabel.innerText = '턴당 유예 시간 (초)';
                if (lastRule !== 'delay') { mainInput.value = 300; extraInput.value = 10; }
            }
            lastRule = select;
        }

        function formatNormalTime(ms) {
            let totalSeconds = Math.ceil(ms / 1000);
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            let s = (totalSeconds % 60).toString().padStart(2, '0');
            return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
        }

        function formatDecimalTime(ms) {
            return (ms / 1000).toFixed(1);
        }

        function applyAndStart() {
            rule = document.getElementById('ruleSelect').value;
            config.mainMs = (parseInt(document.getElementById('mainTime').value) || 0) * 1000;
            config.extraMs = (parseInt(document.getElementById('extraTime').value) || 0) * 1000;
            config.count = parseInt(document.getElementById('byoyomiCount').value) || 1;
            config.incrementMs = (parseInt(document.getElementById('incrementTime').value) || 0) * 1000;

            let ruleText = '';
            if (rule === 'byoyomi') ruleText = `(초읽기 ${config.extraMs/1000}초 ${config.count}회)`;
            else if (rule === 'fischer') ruleText = `(턴당 ${config.extraMs/1000}초 추가)`;
            else if (rule === 'delay') ruleText = `(턴당 ${config.extraMs/1000}초 유예)`;
            else if (rule === 'tournament') {
                let m = Math.floor(config.extraMs / 1000 / 60);
                ruleText = `(턴당 ${config.incrementMs/1000}초 추가, ${config.count}턴 도달 시 ${m > 0 ? m+'분' : (config.extraMs/1000)+'초'} 추가)`;
            }

            document.getElementById('p1-rule').innerText = ruleText;
            document.getElementById('p2-rule').innerText = ruleText;

            resetPlayers();

            document.getElementById('settings-screen').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'flex';
            
            updateDisplay();
            requestWakeLock();
        }

        function resetPlayers() {
            activePlayer = 0;
            isPaused = false;
            clearInterval(timerInterval);
            timerInterval = null;

            p1 = { mainMs: config.mainMs, extraMs: rule === 'byoyomi' ? config.extraMs : 0, count: config.count, turns: 0 };
            p2 = { mainMs: config.mainMs, extraMs: rule === 'byoyomi' ? config.extraMs : 0, count: config.count, turns: 0 };
        }

        function goToSettings() {
            clearInterval(timerInterval);
            document.getElementById('pause-modal').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'none';
            document.getElementById('settings-screen').style.display = 'flex';

            if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        function tapArea(clickedPlayer) {
            if (isPaused) return;

            if (activePlayer === 0) {
                activePlayer = clickedPlayer === 1 ? 2 : 1;
                let startP = activePlayer === 1 ? p1 : p2;
                
                if (rule === 'delay') startP.extraMs = config.extraMs;
                if (rule === 'byoyomi' && startP.mainMs === 0) startP.extraMs = config.extraMs;

                startTimer();
                return;
            }

            if (activePlayer !== clickedPlayer) return;

            let curr = activePlayer === 1 ? p1 : p2;
            curr.turns++; 

            if (rule === 'fischer') {
                curr.mainMs += config.incrementMs;
            } else if (rule === 'tournament') {
                curr.mainMs += config.incrementMs; 
                if (curr.turns === config.count) curr.mainMs += config.extraMs;
            }

            activePlayer = activePlayer === 1 ? 2 : 1;
            let next = activePlayer === 1 ? p1 : p2;

            if (rule === 'delay') next.extraMs = config.extraMs;
            if (rule === 'byoyomi' && next.mainMs === 0) next.extraMs = config.extraMs;

            updateDisplay();
        }

        function startTimer() {
            lastTickTime = Date.now();
            if (!timerInterval) {
                timerInterval = setInterval(tick, 50); 
            }
            updateDisplay();
        }

        function pauseGame() {
            if (activePlayer === 0) return; 
            isPaused = true;
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('pause-modal').style.display = 'flex';
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById('pause-modal').style.display = 'none';
            startTimer();
        }

        function tick() {
            if (activePlayer === 0 || activePlayer === -1 || isPaused) return;

            let now = Date.now();
            let delta = now - lastTickTime;
            lastTickTime = now;

            let p = activePlayer === 1 ? p1 : p2;
            
            if (rule === 'delay') {
                if (p.extraMs > 0) {
                    p.extraMs -= delta;
                    if (p.extraMs < 0) {
                        p.mainMs += p.extraMs; 
                        p.extraMs = 0;
                    }
                } else {
                    p.mainMs -= delta;
                }
            } 
            else if (rule === 'fischer' || rule === 'tournament') {
                p.mainMs -= delta;
            } 
            else if (rule === 'byoyomi') {
                if (p.mainMs > 0) {
                    p.mainMs -= delta;
                    if (p.mainMs <= 0) {
                        let overflow = p.mainMs;
                        p.mainMs = 0;
                        p.extraMs = config.extraMs + overflow; 
                    }
                } else {
                    p.extraMs -= delta;
                    while (p.extraMs <= 0 && p.count > 0) {
                        p.count--;
                        if (p.count > 0) p.extraMs += config.extraMs;
                        else p.extraMs = 0; 
                    }
                }
            }

            checkGameOver(p);
            updateDisplay();
        }

        function checkGameOver(p) {
            if (p.mainMs <= 0 && (rule !== 'byoyomi' || p.count <= 0)) {
                clearInterval(timerInterval);
                timerInterval = null;
                activePlayer = -1; 

                if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
            }
        }

        function updateDisplay() {
            const updatePlayerUI = (pNum, pState) => {
                let area = document.getElementById(`p${pNum}-area`);
                let content = document.getElementById(`p${pNum}-content`);
                let result = document.getElementById(`p${pNum}-result`);
                let timeEl = document.getElementById(`p${pNum}-time`);
                let subEl = document.getElementById(`p${pNum}-sub`);

                // 매번 인라인 스타일을 깔끔하게 초기화합니다.
                area.style.backgroundColor = '';
                area.style.color = '';
                timeEl.style.fontSize = ''; 

                if (activePlayer === -1) {
                    content.style.display = 'none'; 
                    result.style.display = 'block'; 

                    let isLoser = (pState.mainMs <= 0 && (rule !== 'byoyomi' || pState.count <= 0));
                    if (isLoser) {
                        area.className = 'player-area loser'; // CSS의 .loser 배경색이 적용됨
                        result.innerText = '시간 패';
                    } else {
                        area.className = 'player-area winner'; // CSS의 .winner 배경색이 적용됨
                        result.innerText = '시간 승';
                    }
                    return;
                }

                content.style.display = 'flex';
                result.style.display = 'none';

                let isWarning = false;
                let warningTimeMs = 0;

                if (activePlayer === pNum) {
                    if (rule === 'byoyomi') {
                        if (pState.mainMs === 0 && pState.extraMs <= 5000 && pState.extraMs > 0) {
                            isWarning = true;
                            warningTimeMs = pState.extraMs;
                        }
                    } else if (rule === 'delay') {
                        if (pState.extraMs <= 0 && pState.mainMs <= 5000 && pState.mainMs > 0) {
                            isWarning = true;
                            warningTimeMs = pState.mainMs;
                        }
                    } else {
                        if (pState.mainMs <= 5000 && pState.mainMs > 0) {
                            isWarning = true;
                            warningTimeMs = pState.mainMs;
                        }
                    }
                }

                // JS 인라인 스타일 부여 (CSS 클래스보다 우선순위 높음)
                if (activePlayer === 0) {
                    area.className = 'player-area active';
                    subEl.innerText = '터치하여 상대 턴 시작';
                } else if (activePlayer === pNum) {
                    area.className = 'player-area active'; // 기본은 활성 클래스

                    if (isWarning) {
                        // 5초 미만: 노란색(255, 255, 0) -> 빨간색(255, 0, 0)
                        let g = Math.floor((warningTimeMs / 5000) * 255);
                        area.style.backgroundColor = `rgb(255, ${g}, 0)`;
                        area.style.color = '#000000';
                    } else if (rule === 'byoyomi' && pState.mainMs === 0) {
                        // 5초 초과 남은 초읽기 상태: 초록색
                        area.style.backgroundColor = '#2ecc71';
                        area.style.color = '#ffffff';
                    } else {
                        // 활성화 턴 진행 중 (CSS .active의 흰색 유지)
                    }

                    if (rule === 'delay' && pState.extraMs > 0) {
                        subEl.innerText = `유예 시간: ${Math.ceil(pState.extraMs/1000)}초`;
                    } else if (rule === 'byoyomi' && pState.mainMs === 0) {
                        subEl.innerText = `초읽기 남은 횟수: ${pState.count}회`;
                    } else if (rule === 'tournament') {
                        let targetText = pState.turns < pState.count ? ` / 목표: ${pState.count}` : '';
                        subEl.innerText = `내 턴 진행 중 (완료 턴: ${pState.turns}${targetText})`;
                    } else {
                        subEl.innerText = '내 턴 진행 중';
                    }
                } else {
                    area.className = 'player-area'; // 대기 중 (CSS의 회색 적용)
                    if (rule === 'tournament') {
                        let targetText = pState.turns < pState.count ? ` / 목표: ${pState.count}` : '';
                        subEl.innerText = `대기 중 (완료 턴: ${pState.turns}${targetText})`;
                    } else {
                        subEl.innerText = '대기 중';
                    }
                }

                if (isWarning) {
                    let displayMs = Math.max(0, warningTimeMs);
                    timeEl.innerText = formatDecimalTime(displayMs);
                    timeEl.style.fontSize = '1.3em'; // 확대
                } else {
                    if (rule === 'byoyomi' && pState.mainMs === 0) {
                        timeEl.innerText = Math.ceil(pState.extraMs / 1000);
                    } else {
                        timeEl.innerText = formatNormalTime(Math.max(0, pState.mainMs));
                    }
                }
            };

            updatePlayerUI(1, p1);
            updatePlayerUI(2, p2);
        }
    </script>
</body>
</html>
