<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>모바일 보드게임 타이머</title>

    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e272e">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e272e;
            color: #d2dae2;
            overflow: hidden;
        }

        #settings-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background-color: #2c3e50;
        }

        .settings-card {
            background-color: #34495e;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        h2 { text-align: center; margin-bottom: 20px; }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label { margin-bottom: 5px; font-weight: bold; }

        select, input {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 1.1em;
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .btn-start {
            margin-top: 15px;
            padding: 15px;
            width: 100%;
            background-color: #0be881;
            color: #1e272e;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start:active { background-color: #05c46b; }

        #timer-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5em;
            font-weight: bold;
            transition: background 0.1s, color 0.1s;
            background: #7f8c8d;
            color: rgba(255,255,255,0.5);
        }

        #p1-area { transform: rotate(180deg); }

        .player-area.active {
            background: #ffffff !important;
            color: #000000 !important;
        }

        .player-area.danger {
            background: #ff3f34 !important;
            color: #ffffff !important;
        }

        .player-area.loser {
            background: #1e272e !important;
            color: #ff3f34 !important;
        }

        .time-display { font-variant-numeric: tabular-nums; }
        
        .sub-info {
            font-size: 0.25em;
            margin-top: 10px;
            font-weight: normal;
            height: 30px;
        }

        .center-bar {
            height: 60px;
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .btn-pause {
            background-color: #ffa801;
            border: none;
            border-radius: 30px;
            padding: 10px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #1e272e;
            cursor: pointer;
        }

        #pause-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-modal {
            background-color: #0be881;
            border: none;
            padding: 15px 40px;
            margin: 10px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            width: 280px;
        }
        .btn-settings { background-color: #ff3f34; color: white; }
    </style>
</head>
<body>

    <div id="settings-screen">
        <div class="settings-card">
            <h2>타이머 설정</h2>
            
            <div class="form-group">
                <label>시간 규칙</label>
                <select id="ruleSelect" onchange="toggleByoyomiCount()">
                    <option value="byoyomi">초읽기 (기본시간 먼저 소모)</option>
                    <option value="fischer">피셔 (턴당 시간 추가)</option>
                    <option value="delay">딜레이 (유예시간 동안 소모 없음)</option>
                    <option value="tournament">오프라인 체스 대회 (지정 턴 도달 시 시간 추가)</option>
                </select>
            </div>

            <div class="form-group">
                <label>기본 시간 (초)</label>
                <input type="number" id="mainTime" value="300" inputmode="numeric">
            </div>

            <div class="form-group">
                <label id="extraTimeLabel">초읽기 시간 (초)</label>
                <input type="number" id="extraTime" value="30" inputmode="numeric">
            </div>

            <div class="form-group" id="byoyomiCountGroup">
                <label id="countLabel">초읽기 횟수</label>
                <input type="number" id="byoyomiCount" value="3" inputmode="numeric">
            </div>

            <button class="btn-start" onclick="applyAndStart()">완료 및 시작</button>
        </div>
    </div>

    <div id="timer-screen">
        <div class="player-area" id="p1-area" onmousedown="tapArea(1)" ontouchstart="tapArea(1)">
            <div class="time-display" id="p1-time">00:00</div>
            <div class="sub-info" id="p1-sub">터치하여 시작</div>
        </div>

        <div class="center-bar">
            <button class="btn-pause" onclick="pauseGame()">일시정지</button>
        </div>

        <div class="player-area" id="p2-area" onmousedown="tapArea(2)" ontouchstart="tapArea(2)">
            <div class="time-display" id="p2-time">00:00</div>
            <div class="sub-info" id="p2-sub">터치하여 시작</div>
        </div>
    </div>

    <div id="pause-modal">
        <button class="btn-modal" onclick="resumeGame()">계속하기</button>
        <button class="btn-modal btn-settings" onclick="goToSettings()">설정으로 돌아가기</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(error => console.log('Service Worker 등록 실패:', error));
            });
        }

        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        let rule = 'byoyomi';
        let config = { main: 0, extra: 0, count: 0 };
        let p1 = { main: 0, extra: 0, count: 0, turns: 0 };
        let p2 = { main: 0, extra: 0, count: 0, turns: 0 };
        
        let activePlayer = 0; 
        let timerInterval = null;
        let isPaused = false;

        // 규칙 변경 시 텍스트 및 입력창 상태 전환
        function toggleByoyomiCount() {
            const select = document.getElementById('ruleSelect').value;
            const countGroup = document.getElementById('byoyomiCountGroup');
            const countLabel = document.getElementById('countLabel');
            const extraLabel = document.getElementById('extraTimeLabel');

            if (select === 'byoyomi') {
                countGroup.style.display = 'flex';
                countLabel.innerText = '초읽기 횟수';
                extraLabel.innerText = '초읽기 시간 (초)';
            } else if (select === 'tournament') {
                countGroup.style.display = 'flex';
                countLabel.innerText = '시간이 추가될 목표 턴 수 (예: 40)';
                extraLabel.innerText = '목표 턴 통과 시 추가할 시간 (초)';
            } else if (select === 'fischer') {
                countGroup.style.display = 'none';
                extraLabel.innerText = '턴당 추가 시간 (초)';
            } else {
                countGroup.style.display = 'none';
                extraLabel.innerText = '턴당 유예 시간 (초)';
            }
        }

        // 시간이 1시간 이상일 경우 HH:MM:SS, 아니면 MM:SS 로 표시
        function formatTime(seconds) {
            let h = Math.floor(seconds / 3600);
            let m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
        }

        function applyAndStart() {
            rule = document.getElementById('ruleSelect').value;
            config.main = parseInt(document.getElementById('mainTime').value) || 0;
            config.extra = parseInt(document.getElementById('extraTime').value) || 0;
            config.count = parseInt(document.getElementById('byoyomiCount').value) || 1;

            resetPlayers();

            document.getElementById('settings-screen').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'flex';
            
            updateDisplay();
            requestWakeLock();
        }

        function resetPlayers() {
            activePlayer = 0;
            isPaused = false;
            clearInterval(timerInterval);
            timerInterval = null;

            p1 = { main: config.main, extra: rule === 'byoyomi' ? config.extra : 0, count: config.count, turns: 0 };
            p2 = { main: config.main, extra: rule === 'byoyomi' ? config.extra : 0, count: config.count, turns: 0 };
        }

        function goToSettings() {
            clearInterval(timerInterval);
            document.getElementById('pause-modal').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'none';
            document.getElementById('settings-screen').style.display = 'flex';

            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        function tapArea(clickedPlayer) {
            if (isPaused) return;

            // 1) 게임 시작 전 최초 터치
            if (activePlayer === 0) {
                activePlayer = clickedPlayer === 1 ? 2 : 1;
                let startP = activePlayer === 1 ? p1 : p2;
                
                // 버그 수정: 딜레이 방식 첫 턴 유예시간 부여
                if (rule === 'delay') {
                    startP.extra = config.extra;
                }
                if (rule === 'byoyomi' && startP.main === 0) {
                    startP.extra = config.extra;
                }

                startTimer();
                return;
            }

            // 내 턴이 아니면 무시
            if (activePlayer !== clickedPlayer) return;

            // 방금 턴을 마친 사람의 상태 업데이트
            let curr = activePlayer === 1 ? p1 : p2;
            curr.turns++; // 마친 턴 수 증가

            if (rule === 'fischer') {
                curr.main += config.extra;
            } else if (rule === 'tournament') {
                // 목표 턴 수에 도달하면 통째로 시간 추가
                if (curr.turns === config.count) {
                    curr.main += config.extra;
                }
            }

            // 턴 넘기기
            activePlayer = activePlayer === 1 ? 2 : 1;
            let next = activePlayer === 1 ? p1 : p2;

            if (rule === 'delay') {
                next.extra = config.extra;
            }
            if (rule === 'byoyomi' && next.main === 0) {
                next.extra = config.extra;
            }

            updateDisplay();
        }

        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(tick, 1000);
            }
            updateDisplay();
        }

        function pauseGame() {
            if (activePlayer === 0) return; 
            isPaused = true;
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('pause-modal').style.display = 'flex';
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById('pause-modal').style.display = 'none';
            startTimer();
        }

        function tick() {
            let p = activePlayer === 1 ? p1 : p2;
            
            if (rule === 'delay') {
                if (p.extra > 0) p.extra--;
                else p.main--;
            } 
            else if (rule === 'fischer' || rule === 'tournament') {
                // 피셔와 토너먼트는 평소에는 메인 시간만 깎임
                p.main--;
            } 
            else if (rule === 'byoyomi') {
                if (p.main > 0) {
                    p.main--;
                    if (p.main === 0) p.extra = config.extra;
                } else {
                    p.extra--;
                    if (p.extra < 0) {
                        p.count--;
                        if (p.count > 0) p.extra = config.extra;
                    }
                }
            }

            checkGameOver(p);
            updateDisplay();
        }

        function checkGameOver(p) {
            if (p.main <= 0 && (rule !== 'byoyomi' || p.count <= 0)) {
                clearInterval(timerInterval);
                timerInterval = null;
                activePlayer = -1; // 게임 종료 상태

                if (wakeLock !== null) {
                    wakeLock.release().then(() => { wakeLock = null; });
                }
            }
        }

        function updateDisplay() {
            const updatePlayerUI = (pNum, pState) => {
                let area = document.getElementById(`p${pNum}-area`);
                let timeEl = document.getElementById(`p${pNum}-time`);
                let subEl = document.getElementById(`p${pNum}-sub`);

                // UI 상태 및 텍스트 분기
                if (activePlayer === -1) {
                    if (pState.main <= 0 && (rule !== 'byoyomi' || pState.count <= 0)) {
                        area.className = 'player-area loser';
                        subEl.innerText = '시간 초과로 패배';
                    } else {
                        area.className = 'player-area';
                        subEl.innerText = '승리!';
                    }
                } else if (activePlayer === 0) {
                    area.className = 'player-area active';
                    subEl.innerText = '터치하여 상대 턴 시작';
                } else if (activePlayer === pNum) {
                    if (rule === 'byoyomi' && pState.main === 0) {
                        area.className = 'player-area danger';
                    } else {
                        area.className = 'player-area active';
                    }

                    // 규칙별 진행 중 텍스트
                    if (rule === 'delay' && pState.extra > 0) {
                        subEl.innerText = `유예 시간: ${pState.extra}초`;
                    } else if (rule === 'byoyomi' && pState.main === 0) {
                        subEl.innerText = `초읽기 남은 횟수: ${pState.count}회`;
                    } else if (rule === 'tournament') {
                        let targetText = pState.turns < pState.count ? ` / 목표: ${pState.count}` : '';
                        subEl.innerText = `완료 턴: ${pState.turns}${targetText}`;
                    } else {
                        subEl.innerText = '내 턴 진행 중';
                    }
                } else {
                    area.className = 'player-area';
                    
                    if (rule === 'tournament') {
                        let targetText = pState.turns < pState.count ? ` / 목표: ${pState.count}` : '';
                        subEl.innerText = `대기 중 (완료 턴: ${pState.turns}${targetText})`;
                    } else {
                        subEl.innerText = '대기 중';
                    }
                }

                // 타이머 렌더링
                if (rule === 'byoyomi' && pState.main === 0) {
                    timeEl.innerText = pState.extra;
                } else {
                    timeEl.innerText = formatTime(Math.max(0, pState.main));
                }
            };

            updatePlayerUI(1, p1);
            updatePlayerUI(2, p2);
        }
    </script>
</body>
</html>
