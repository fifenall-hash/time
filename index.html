<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 보드게임 타이머</title>

    <!-- 아이콘 설정 -->
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- PWA 매니페스트 및 테마 색상 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e272e">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e272e;
            color: #d2dae2;
            overflow: hidden;
        }

        #settings-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background-color: #2c3e50;
        }

        .settings-card {
            background-color: #34495e;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        h2 { text-align: center; margin-bottom: 20px; }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label { margin-bottom: 5px; font-weight: bold; }

        select, input {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 1.1em;
            background-color: #ecf0f1;
            color: #2c3e50;
        }

        .btn-start {
            margin-top: 20px;
            padding: 15px;
            width: 100%;
            background-color: #0be881;
            color: #1e272e;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start:active { background-color: #05c46b; }

        #timer-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5em;
            font-weight: bold;
            transition: background-color 0.1s;
        }

        #p1-area {
            transform: rotate(180deg);
            background-color: #7f8c8d;
            color: rgba(255,255,255,0.5);
        }

        #p2-area {
            background-color: #7f8c8d;
            color: rgba(255,255,255,0.5);
        }

        .player-area.active {
            background-color: #0be881;
            color: #1e272e;
        }

        .player-area.danger {
            background-color: #ff3f34;
            color: white;
        }

        .player-area.loser {
            background-color: #1e272e;
            color: #ff3f34;
        }

        .time-display { font-variant-numeric: tabular-nums; }
        
        .sub-info {
            font-size: 0.25em;
            margin-top: 10px;
            font-weight: normal;
            height: 30px;
        }

        .center-bar {
            height: 60px;
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .btn-pause {
            background-color: #ffa801;
            border: none;
            border-radius: 30px;
            padding: 10px 40px;
            font-size: 1.2em;
            font-weight: bold;
            color: #1e272e;
            cursor: pointer;
        }

        #pause-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-modal {
            background-color: #0be881;
            border: none;
            padding: 15px 40px;
            margin: 10px;
            border-radius: 8px;
            font-size: 1.5em;
            font-weight: bold;
            width: 250px;
        }
        .btn-settings { background-color: #ff3f34; color: white; }
    </style>
</head>
<body>

    <div id="settings-screen">
        <div class="settings-card">
            <h2>타이머 설정</h2>
            
            <div class="form-group">
                <label>시간 규칙</label>
                <select id="ruleSelect" onchange="toggleByoyomiCount()">
                    <option value="byoyomi">초읽기 (Byo-yomi)</option>
                    <option value="fischer">피셔 (Increment)</option>
                    <option value="delay">딜레이 (Delay)</option>
                </select>
            </div>

            <div class="form-group">
                <label>기본 시간 (초)</label>
                <input type="number" id="mainTime" value="300" inputmode="numeric">
            </div>

            <div class="form-group">
                <label id="extraTimeLabel">초읽기 시간 (초)</label>
                <input type="number" id="extraTime" value="30" inputmode="numeric">
            </div>

            <div class="form-group" id="byoyomiCountGroup">
                <label>초읽기 횟수</label>
                <input type="number" id="byoyomiCount" value="3" inputmode="numeric">
            </div>

            <button class="btn-start" onclick="applyAndStart()">완료 및 시작</button>
        </div>
    </div>

    <div id="timer-screen">
        <div class="player-area" id="p1-area" onmousedown="tapArea(1)" ontouchstart="tapArea(1)">
            <div class="time-display" id="p1-time">00:00</div>
            <div class="sub-info" id="p1-sub">터치하여 시작</div>
        </div>

        <div class="center-bar">
            <button class="btn-pause" onclick="pauseGame()">일시정지</button>
        </div>

        <div class="player-area" id="p2-area" onmousedown="tapArea(2)" ontouchstart="tapArea(2)">
            <div class="time-display" id="p2-time">00:00</div>
            <div class="sub-info" id="p2-sub">터치하여 시작</div>
        </div>
    </div>

    <div id="pause-modal">
        <button class="btn-modal" onclick="resumeGame()">계속하기</button>
        <button class="btn-modal btn-settings" onclick="goToSettings()">설정으로 돌아가기</button>
    </div>

    <script>
        // PWA 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(error => console.log('Service Worker 등록 실패:', error));
            });
        }

        // --- 화면 꺼짐 방지(Wake Lock) 기능 시작 ---
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('화면 꺼짐 방지가 활성화되었습니다.');
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('화면 꺼짐 방지가 해제되었습니다.');
                    });
                }
            } catch (err) {
                console.log(`Wake Lock Error: ${err.name}, ${err.message}`);
            }
        }

        // 사용자가 다른 탭/앱으로 갔다가 다시 돌아왔을 때 화면 잠금 재활성화
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
        // --- 화면 꺼짐 방지(Wake Lock) 기능 끝 ---

        let rule = 'byoyomi';
        let config = { main: 0, extra: 0, count: 0 };
        let p1 = { main: 0, extra: 0, count: 0 };
        let p2 = { main: 0, extra: 0, count: 0 };
        
        let activePlayer = 0; 
        let timerInterval = null;
        let isPaused = false;

        function toggleByoyomiCount() {
            const select = document.getElementById('ruleSelect').value;
            const countGroup = document.getElementById('byoyomiCountGroup');
            const extraLabel = document.getElementById('extraTimeLabel');

            if (select === 'byoyomi') {
                countGroup.style.display = 'flex';
                extraLabel.innerText = '초읽기 시간 (초)';
            } else if (select === 'fischer') {
                countGroup.style.display = 'none';
                extraLabel.innerText = '턴당 추가 시간 (초)';
            } else {
                countGroup.style.display = 'none';
                extraLabel.innerText = '턴당 유예 시간 (초)';
            }
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function applyAndStart() {
            rule = document.getElementById('ruleSelect').value;
            config.main = parseInt(document.getElementById('mainTime').value) || 0;
            config.extra = parseInt(document.getElementById('extraTime').value) || 0;
            config.count = parseInt(document.getElementById('byoyomiCount').value) || 1;

            resetPlayers();

            document.getElementById('settings-screen').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'flex';
            
            updateDisplay();

            // 타이머 시작 시 화면 꺼짐 방지 요청
            requestWakeLock();
        }

        function resetPlayers() {
            activePlayer = 0;
            isPaused = false;
            clearInterval(timerInterval);
            timerInterval = null;

            p1 = { main: config.main, extra: rule === 'byoyomi' ? config.extra : 0, count: config.count };
            p2 = { main: config.main, extra: rule === 'byoyomi' ? config.extra : 0, count: config.count };

            document.getElementById('p1-area').className = 'player-area';
            document.getElementById('p2-area').className = 'player-area';
            document.getElementById('p1-sub').innerText = '터치하여 상대 턴 시작';
            document.getElementById('p2-sub').innerText = '터치하여 상대 턴 시작';
        }

        function goToSettings() {
            clearInterval(timerInterval);
            document.getElementById('pause-modal').style.display = 'none';
            document.getElementById('timer-screen').style.display = 'none';
            document.getElementById('settings-screen').style.display = 'flex';

            // 설정 화면으로 돌아갈 때는 폰이 꺼질 수 있도록 Wake Lock 해제
            if (wakeLock !== null) {
                wakeLock.release()
                    .then(() => { wakeLock = null; });
            }
        }

        function tapArea(clickedPlayer) {
            if (isPaused) return;

            if (activePlayer === 0) {
                activePlayer = clickedPlayer === 1 ? 2 : 1;
                startTimer();
                return;
            }

            if (activePlayer !== clickedPlayer) return;

            let curr = activePlayer === 1 ? p1 : p2;

            if (rule === 'fischer') {
                curr.main += config.extra;
            }

            activePlayer = activePlayer === 1 ? 2 : 1;
            let next = activePlayer === 1 ? p1 : p2;

            if (rule === 'delay') {
                next.extra = config.extra;
            }
            if (rule === 'byoyomi' && next.main === 0) {
                next.extra = config.extra;
            }

            updateDisplay();
        }

        function startTimer() {
            if (!timerInterval) {
                timerInterval = setInterval(tick, 1000);
            }
            updateDisplay();
        }

        function pauseGame() {
            if (activePlayer === 0) return; 
            isPaused = true;
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('pause-modal').style.display = 'flex';
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById('pause-modal').style.display = 'none';
            startTimer();
        }

        function tick() {
            let p = activePlayer === 1 ? p1 : p2;
            
            if (rule === 'delay') {
                if (p.extra > 0) p.extra--;
                else p.main--;
            } 
            else if (rule === 'fischer') {
                p.main--;
            } 
            else if (rule === 'byoyomi') {
                if (p.main > 0) {
                    p.main--;
                    if (p.main === 0) {
                        p.extra = config.extra;
                    }
                } else {
                    p.extra--;
                    if (p.extra < 0) {
                        p.count--;
                        if (p.count > 0) {
                            p.extra = config.extra;
                        }
                    }
                }
            }

            checkGameOver(p);
            updateDisplay();
        }

        function checkGameOver(p) {
            if (p.main <= 0 && (rule !== 'byoyomi' || p.count <= 0)) {
                clearInterval(timerInterval);
                timerInterval = null;
                
                let area = document.getElementById(`p${activePlayer}-area`);
                area.className = 'player-area loser';
                document.getElementById(`p${activePlayer}-sub`).innerText = '시간 초과로 패배';
                activePlayer = -1;

                // 게임이 완전히 종료되었으므로 Wake Lock 해제
                if (wakeLock !== null) {
                    wakeLock.release()
                        .then(() => { wakeLock = null; });
                }
            }
        }

        function updateDisplay() {
            const updatePlayerUI = (pNum, pState) => {
                let area = document.getElementById(`p${pNum}-area`);
                let timeEl = document.getElementById(`p${pNum}-time`);
                let subEl = document.getElementById(`p${pNum}-sub`);

                if (activePlayer !== -1) {
                    if (activePlayer === pNum) {
                        if (rule === 'byoyomi' && pState.main === 0) {
                            area.className = 'player-area danger';
                        } else {
                            area.className = 'player-area active';
                        }
                    } else {
                        area.className = 'player-area';
                    }
                }

                if (rule === 'byoyomi' && pState.main === 0) {
                    timeEl.innerText = pState.extra;
                    subEl.innerText = `초읽기 남은 횟수: ${pState.count}회`;
                } else {
                    timeEl.innerText = formatTime(Math.max(0, pState.main));
                    if (rule === 'delay' && pState.extra > 0 && activePlayer === pNum) {
                        subEl.innerText = `유예 시간: ${pState.extra}초`;
                    } else if (activePlayer !== 0 && activePlayer !== -1) {
                        subEl.innerText = activePlayer === pNum ? '내 턴 진행 중' : '대기 중';
                    }
                }
            };

            updatePlayerUI(1, p1);
            updatePlayerUI(2, p2);
        }
    </script>
</body>
</html>
